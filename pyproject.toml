[build-system]
requires = []
build-backend = "setuptools.build_meta:__legacy__"

[project]
name = "firesentinel"
version = "0.0.0"
description = "Local FireSentinel OpenCV 5 runtime proof"
requires-python = "==3.13.7"
dependencies = [
    "netCDF4==1.7.4",
    "numpy==2.5.1",
    "opencv-python-headless==5.0.0.93",
    "pyproj==3.7.2",
    "pytest==9.1.1",
    "streamlit==1.60.0",
    "xarray==2026.7.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-ra -p no:cacheprovider"

[tool.ruff]
target-version = "py313"
line-length = 88
extend-exclude = [".venv", ".venv-*", "artifacts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.13"
files = ["src", "tests", "scripts"]
strict = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = ["cv2", "streamlit"]
ignore_missing_imports = true
