[build-system]
requires = []
build-backend = "setuptools.build_meta:__legacy__"

[project]
name = "firesentinel"
version = "0.0.0"
description = "Local FireSentinel OpenCV 5 runtime proof"
requires-python = "==3.13.7"
dependencies = [
    "netCDF4==1.7.4",
    "numpy==2.5.1",
    "opencv-python-headless==5.0.0.93",
    "pyproj==3.7.2",
    "pytest==9.1.1",
    "streamlit==1.60.0",
    "xarray==2026.7.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -p no:cacheprovider"
